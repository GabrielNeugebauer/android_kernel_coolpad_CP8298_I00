name: Build me1ds kernel (3.18, LineageOS 15.1)

on:
  push:
    branches: ["feat/**", "lineage-15.1"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          submodules: true

      # ReSukiSU derives its version from the submodule's commit count and tag
      - name: Unshallow KernelSU
        run: |
          cd src/KernelSU
          git fetch -q --unshallow --tags origin || git fetch -q --tags origin
          echo "KernelSU $(git describe --tags --abbrev=0) commits $(git rev-list --count HEAD)"

      - name: Fetch GCC 4.9 aarch64 toolchain
        run: |
          git clone --depth 1 -b android-9.0.0_r61 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 tc

      - name: Build in Ubuntu 18.04
        run: |
          mkdir -p out
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/src ubuntu:18.04 bash -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bc bison flex make gcc libc6-dev libssl-dev python perl cpio liblz4-tool git >/dev/null
            git config --global --add safe.directory "*"
            git config --global --add safe.directory /w/src/KernelSU
            export ARCH=arm64 CROSS_COMPILE=/w/tc/bin/aarch64-linux-android-
            make O=/w/out me1ds_defconfig
            make O=/w/out -k -j"$(nproc)" 2>&1 | tee /w/out/build.log; exit ${PIPESTATUS[0]}
          '
          ls -la out/arch/arm64/boot/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me1ds-kernel-3.18
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/*.dtb
            out/.config
            out/build.log
